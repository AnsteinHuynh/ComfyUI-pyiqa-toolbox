[project]
# Registry node id. The registry spec forbids "ComfyUI" in `name`, and the id is
# immutable after the first publish (it is in the install URL) - hence
# "pyiqa-toolbox" while the GitHub repository keeps its ComfyUI- name.
name = "pyiqa-toolbox"
description = "ComfyUI nodes wrapping pyiqa (IQA-PyTorch) quality metrics: one loader over the whole registry, generic FR/NR score nodes, plus dedicated nodes for Q-ReAlign, FGResQ, FID and CLIP Score."
version = "0.2.1"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{name = "Anstein Huynh"}]
keywords = [
    "comfyui",
    "custom-nodes",
    "image-quality",
    "iqa",
    "pyiqa",
    "image-quality-assessment",
    "int8",
    "quantization",
]
classifiers = [
    "Operating System :: OS Independent",
    "Environment :: GPU :: NVIDIA CUDA",
]
# Node requirements live in requirements.txt (installed by ComfyUI / Manager).
# The registry's `dependencies` field is for ComfyUI *frontend* compatibility, so
# it is left dynamic instead of being misused to carry pyiqa.
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[project.urls]
Repository = "https://github.com/AnsteinHuynh/ComfyUI-pyiqa-toolbox"
"Bug Tracker" = "https://github.com/AnsteinHuynh/ComfyUI-pyiqa-toolbox/issues"

[tool.comfy]
# PublisherId is the registry's *publisher id*, not the profile name. The account
# displays as "AnsteinHuynh" but its id - the string after the @ on the profile
# page, and the one in every registry URL - is lowercase "ansteinhuynh". The
# registry matches it exactly (GET /publishers/AnsteinHuynh is a 404, and posting
# a version under it fails with "Failed to validate token"), and comfy-cli uses
# this value verbatim in the URL. Immutable after the first publish.
PublisherId = "ansteinhuynh"
DisplayName = "pyiqa-toolbox"
